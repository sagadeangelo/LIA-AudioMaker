services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: lia_audiomaker
      POSTGRES_USER: lia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U lia -d lia_audiomaker"]
      interval: 5s
      timeout: 5s
      retries: 15
  backend:
    build: ./backend
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://lia:${POSTGRES_PASSWORD}@db:5432/lia_audiomaker
      DATA_DIR: /data
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - audio_data:/data
volumes:
  postgres_data:
  audio_data:
